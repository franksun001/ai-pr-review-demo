# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# https://docs.coderabbit.ai/guides/configure-coderabbit
language: "zh-CN"
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "src/**"
      instructions: |
        Focus on code quality and DRY, not formatting nitpicks.
        If `.topic-card` markup is duplicated in App.tsx, strongly suggest extracting
        `src/components/TopicCard.tsx` with props like badge, title, body, items.
        Prefer concrete refactor suggestions (component name + file path + props).
        Do NOT emphasize import order, trailing commas, or pure style nits.
chat:
  auto_reply: true
