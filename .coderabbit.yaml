# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "zh-CN"
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "src/**"
      instructions: |
        Review for maintainability and DRY, not formatting.
        If the same UI structure is copy-pasted 2+ times, suggest extracting
        a shared React component. Name a concrete file path and props.
        Skip import order, trailing commas, and pure style nits.
        Do not praise without an actionable suggestion.
chat:
  auto_reply: true
